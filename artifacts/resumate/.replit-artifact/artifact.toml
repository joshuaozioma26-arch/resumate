kind = "web"
previewPath = "/"
title = "ResuMate"
version = "1.0.0"
id = "artifacts/resumate"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20342

[services.development]
run = "pnpm --filter @workspace/resumate run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/resumate", "run", "build" ]
publicDir = "artifacts/resumate/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20342"
BASE_PATH = "/"
